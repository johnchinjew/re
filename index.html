<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Re</title>
<style>
  :root{
    --bg: #f4f4f3;
    --panel: #ffffff;
    --cell: #ffffff;
    --cell-border: #dcdcda;
    --fg: #1a1a1a;
    --muted: #8a8d94;
    --accent: #d93838;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    touch-action:manipulation;
  }
  #app{
    width:min(94vw, 480px);
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:16px 0 24px;
  }
  #topRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  #seedLabel{
    font-size:13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:var(--muted);
    letter-spacing:0.3px;
    user-select:text;
    -webkit-user-select:text;
  }
  #sizeSelect{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--fg);
    font: inherit;
    font-size:13px;
    padding:8px 12px;
    cursor:pointer;
    -webkit-appearance:none;
    -moz-appearance:none;
    appearance:none;
  }
  #boardWrap{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
  }
  #board{
    position:absolute;
    inset:0;
    display:grid;
    gap:4px;
    background:var(--bg);
    user-select:none;
  }
  .cell{
    position:relative;
    background:var(--cell);
    border:1px solid var(--cell-border);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .cell.empty{ cursor:pointer; }
  .cell.selected{
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .shape{
    position:absolute;
    inset:3px;
    background: var(--fg);
    opacity:0.92;
  }
  .shape.clearing{
    /* Keep the expanding shape above every cell background without raising
       its own cell background over neighboring animations. */
    z-index:4;
    pointer-events:none;
    animation: cellPop 0.32s ease-out forwards;
  }
  @keyframes cellPop{
    0%   { transform: scale(1);    opacity: 0.92; }
    20%  { transform: scale(0.7);  opacity: 0.92; }
    55%  { transform: scale(1.22); opacity: 0.2; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .shape.tl{ clip-path: polygon(0 0, 100% 0, 0 100%); }
  .shape.tr{ clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .shape.br{ clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .shape.bl{ clip-path: polygon(0 0, 0 100%, 100% 100%); }

  #ball{
    position:absolute;
    width:16%;
    height:16%;
    border-radius:50%;
    background:var(--accent);
    top:0; left:0;
    transform: translate(-50%,-50%);
    transition: left 0.24s linear, top 0.24s linear, opacity 0.15s linear;
    pointer-events:none;
    opacity:0;
    z-index:5;
  }
  /* squash (anticipation) then stretch (release) along the fire axis;
     deliberately longer than stepDelay so it's still mid-release when the
     ball's first move starts, instead of finishing while it sits still */
  #ball.launch-x{ animation: launchX 0.34s ease-out; }
  #ball.launch-y{ animation: launchY 0.34s ease-out; }
  @keyframes launchX{
    0%   { transform: translate(-50%,-50%) scaleX(1)    scaleY(1); }
    30%  { transform: translate(-50%,-50%) scaleX(0.6)  scaleY(1.3); }
    65%  { transform: translate(-50%,-50%) scaleX(1.45) scaleY(0.75); }
    100% { transform: translate(-50%,-50%) scaleX(1)    scaleY(1); }
  }
  @keyframes launchY{
    0%   { transform: translate(-50%,-50%) scaleX(1)    scaleY(1); }
    30%  { transform: translate(-50%,-50%) scaleX(1.3)  scaleY(0.6); }
    65%  { transform: translate(-50%,-50%) scaleX(0.75) scaleY(1.45); }
    100% { transform: translate(-50%,-50%) scaleX(1)    scaleY(1); }
  }

  footer{
    min-height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  button{
    font: inherit;
    border:none;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:var(--fg);
    background:var(--panel);
    border:1px solid var(--cell-border);
  }
  button:active{ transform: scale(0.96); }
  button.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  #dirPad{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
  }
  #dirPad button{
    width:52px; height:52px;
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,12,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
  }
  .overlay[hidden]{ display:none; }
  .overlay-card{
    background:var(--panel);
    border:1px solid var(--cell-border);
    padding:24px;
    width:min(80vw, 320px);
    text-align:center;
  }
  .overlay-card h2{
    margin:0 0 18px;
    font-size:20px;
  }
  .overlay-card p{
    margin:0 0 18px;
    font-size:14px;
    line-height:1.5;
    color:var(--muted);
    text-align:left;
  }
  .overlay-card .row{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  #topRowRight{
    display:flex;
    align-items:center;
    gap:8px;
  }
  #helpBtn{
    font-size:13px;
    font-weight:400;
    padding:8px 12px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topRow">
    <div id="seedLabel"></div>
    <div id="topRowRight">
      <button id="helpBtn">How to play</button>
      <select id="sizeSelect">
        <option value="5" selected>5 &times; 5</option>
        <option value="6">6 &times; 6</option>
        <option value="7">7 &times; 7</option>
      </select>
    </div>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="ball"></div>
  </div>

  <footer id="footer">
    <div id="dirPad" hidden>
      <button data-dir="left">&larr;</button>
      <button data-dir="up">&uarr;</button>
      <button data-dir="down">&darr;</button>
      <button data-dir="right">&rarr;</button>
    </div>
  </footer>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="overlayTitle">Cleared!</h2>
    <div class="row">
      <button id="overlayReset">Try again</button>
      <button class="primary" id="overlayNew">New puzzle</button>
    </div>
  </div>
</div>

<div id="helpOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2>How to play</h2>
    <p>
      Clear the whole grid in one shot to solve the puzzle.<br><br>
      To shoot, tap an empty cell, then pick a direction.
    </p>
    <div class="row">
      <button class="primary" id="helpClose">Got it</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DIRS = {
    up:    {x:0, y:-1},
    down:  {x:0, y:1},
    left:  {x:-1, y:0},
    right: {x:1, y:0}
  };
  var TYPES = ['sq','tl','tr','br','bl'];

  var state = {
    size: 5,
    seed: 0,
    grid: null,         // current mutable grid
    initialGrid: null,  // snapshot for "Try again"
    selected: null,      // {r,c}
    animating: false
  };

  var boardEl = document.getElementById('board');
  var ballEl = document.getElementById('ball');
  var dirPad = document.getElementById('dirPad');
  var overlay = document.getElementById('overlay');
  var seedLabel = document.getElementById('seedLabel');

  // Deterministic PRNG (mulberry32) so a given seed always reproduces the
  // exact same puzzle -- the puzzle's "title" is just its seed, and it can
  // be shared/replayed via a ?puzzle= URL query param.
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function randomSeed(){
    return Math.floor(Math.random() * 1e9);
  }

  function cloneGrid(g){
    return g.map(function(row){ return row.slice(); });
  }

  // A right triangle's two straight legs are solid walls (like a square,
  // 180-degree bounce); only its diagonal hypotenuse acts as a mirror
  // (90-degree deflection). Which two of the four incoming directions hit
  // a leg vs. the hypotenuse depends on which corner holds the right angle.
  function reflect(dir, type){
    if(type === 'sq') return {x:-dir.x, y:-dir.y};

    var legHit;
    if(type === 'tl')      legHit = (dir.x === 1  || dir.y === 1);  // left/top legs
    else if(type === 'tr') legHit = (dir.y === 1  || dir.x === -1); // top/right legs
    else if(type === 'br') legHit = (dir.y === -1 || dir.x === -1); // bottom/right legs
    else /* bl */           legHit = (dir.y === -1 || dir.x === 1);  // bottom/left legs

    if(legHit) return {x:-dir.x, y:-dir.y};
    if(type === 'tl' || type === 'br') return {x:-dir.y, y:-dir.x}; // '/' mirror
    return {x:dir.y, y:dir.x}; // 'tr' / 'bl' -> '\' mirror
  }

  function generateLevel(size, seed){
    var rng = mulberry32(seed);
    function randInt(n){ return Math.floor(rng()*n); }
    var target = Math.max(6, Math.round(size*size*0.38));
    var best = null;

    for(var attempt=0; attempt<40; attempt++){
      var grid = [];
      for(var i=0;i<size;i++) grid.push(new Array(size).fill(''));
      // `grid` is the permanent level layout being built up as the simulated
      // ball travels. `hit` marks obstacle cells already consumed in this
      // pass (so a loop back over one just passes through, like real play).
      // `decided` marks any cell (obstacle or not) whose fate is final the
      // first time the path reaches it -- required because a real replay
      // only sees the finished grid, so a cell left empty on an early visit
      // can never be turned into an obstacle on a later visit without the
      // replay diverging (it would hit that obstacle immediately instead).
      var hit = {};
      var decided = {};

      var start = {r: randInt(size), c: randInt(size)};
      var dirKeys = Object.keys(DIRS);
      var dir = DIRS[dirKeys[randInt(dirKeys.length)]];

      var pos = {r:start.r, c:start.c};
      var placed = 0;
      var steps = 0;
      var maxSteps = size*size*8;
      decided[start.r + ',' + start.c] = true;

      while(steps++ < maxSteps){
        var next = {r: pos.r + dir.y, c: pos.c + dir.x};
        if(next.r < 0 || next.r >= size || next.c < 0 || next.c >= size) break;

        var key = next.r + ',' + next.c;
        var existing = grid[next.r][next.c];

        if(existing && !hit[key]){
          hit[key] = true;
          dir = reflect(dir, existing);
          pos = next;
          continue;
        }
        if(existing && hit[key]){
          pos = next;
          continue;
        }

        if(!decided[key]){
          decided[key] = true;
          if(placed < target && rng() < 0.6){
            var type = TYPES[randInt(TYPES.length)];
            grid[next.r][next.c] = type;
            hit[key] = true;
            placed++;
            dir = reflect(dir, type);
            pos = next;
            continue;
          }
        }
        pos = next;
      }

      if(!best || placed > best.placed){
        best = {grid: grid, placed: placed};
      }
      if(placed >= target) break;
    }
    return best.grid;
  }

  function countRemaining(grid){
    var n = 0;
    for(var r=0;r<grid.length;r++)
      for(var c=0;c<grid[r].length;c++)
        if(grid[r][c]) n++;
    return n;
  }

  // The size (5/6/7) is folded into the low digits of the seed itself, so a
  // single ?puzzle=... fully determines both the grid size and its layout.
  function encodeSeed(raw, size){
    return raw * 3 + (size - 5);
  }
  function decodeSize(seed){
    return (((seed % 3) + 3) % 3) + 5;
  }

  function newPuzzle(seed){
    if(seed === undefined || seed === null){
      state.seed = encodeSeed(randomSeed(), state.size);
    } else {
      state.seed = seed;
      state.size = decodeSize(seed);
      sizeSelect.value = String(state.size);
    }
    state.grid = generateLevel(state.size, state.seed);
    state.initialGrid = cloneGrid(state.grid);
    updateURL();
    seedLabel.textContent = 'Puzzle #' + state.seed;
    startFresh();
  }

  function resetPuzzle(){
    state.grid = cloneGrid(state.initialGrid);
    startFresh();
  }

  function startFresh(){
    state.selected = null;
    state.animating = false;
    overlay.hidden = true;
    ballEl.style.opacity = 0;
    dirPad.hidden = true;
    render();
  }

  function render(){
    var size = state.size;
    boardEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    boardEl.style.gridTemplateRows = 'repeat(' + size + ', 1fr)';
    boardEl.innerHTML = '';

    for(var r=0;r<size;r++){
      for(var c=0;c<size;c++){
        var type = state.grid[r][c];
        var cell = document.createElement('div');
        cell.className = 'cell' + (type ? '' : ' empty');
        cell.dataset.r = r;
        cell.dataset.c = c;

        if(state.selected && state.selected.r === r && state.selected.c === c){
          cell.className += ' selected';
        }

        if(type){
          var shape = document.createElement('div');
          shape.className = 'shape ' + type;
          cell.appendChild(shape);
        } else {
          cell.addEventListener('click', onCellClick);
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function onCellClick(e){
    if(state.animating) return;
    var r = +e.currentTarget.dataset.r;
    var c = +e.currentTarget.dataset.c;
    state.selected = {r:r, c:c};
    render();
    dirPad.hidden = false;
  }

  function cellRect(r, c){
    var boardRect = boardEl.getBoundingClientRect();
    var wrapRect = document.getElementById('boardWrap').getBoundingClientRect();
    var cellW = boardRect.width / state.size;
    var cellH = boardRect.height / state.size;
    var offX = boardRect.left - wrapRect.left;
    var offY = boardRect.top - wrapRect.top;
    return {
      x: offX + cellW * (c + 0.5),
      y: offY + cellH * (r + 0.5),
      w: cellW,
      h: cellH
    };
  }

  function simulateShot(grid, start, dir){
    var path = [{r:start.r, c:start.c}];
    var clears = [];
    var pos = {r:start.r, c:start.c};
    var d = {x:dir.x, y:dir.y};
    var steps = 0;
    var maxSteps = grid.length * grid.length * 8;
    var exited = false;

    while(steps++ < maxSteps){
      var next = {r: pos.r + d.y, c: pos.c + d.x};
      if(next.r < 0 || next.r >= grid.length || next.c < 0 || next.c >= grid.length){
        exited = true;
        break;
      }
      var type = grid[next.r][next.c];
      path.push({r: next.r, c: next.c});
      if(type){
        clears.push({r: next.r, c: next.c, type: type});
        grid[next.r][next.c] = '';
        d = reflect(d, type);
      }
      pos = next;
    }
    return {path: path, clears: clears, exited: exited, finalDir: d};
  }

  function launch(dir){
    if(state.animating) return;
    var start = state.selected;
    if(!start) return;
    state.animating = true;
    dirPad.hidden = true;

    var result = simulateShot(state.grid, start, DIRS[dir]);
    var clearSet = {};
    result.clears.forEach(function(cl){ clearSet[cl.r + ',' + cl.c] = true; });

    // ball appears at start -- jump there with transitions off so it
    // doesn't visibly slide in from wherever it ended up last shot
    var r0 = cellRect(start.r, start.c);
    ballEl.style.transition = 'none';
    ballEl.style.width = r0.w * 0.36 + 'px';
    ballEl.style.height = r0.w * 0.36 + 'px';
    ballEl.style.left = r0.x + 'px';
    ballEl.style.top = r0.y + 'px';
    ballEl.style.opacity = 1;
    ballEl.getBoundingClientRect(); // force reflow so the jump applies before re-enabling transitions
    ballEl.style.transition = '';

    ballEl.classList.remove('launch-x', 'launch-y');
    void ballEl.offsetWidth; // reflow so re-adding the same class restarts the animation
    ballEl.classList.add(dir === 'left' || dir === 'right' ? 'launch-x' : 'launch-y');

    var i = 1; // index into path, 0 is start
    var stepDelay = 240;

    function step(){
      if(i >= result.path.length){
        finishShot(result);
        return;
      }
      var cell = result.path[i];
      var rect = cellRect(cell.r, cell.c);
      ballEl.style.left = rect.x + 'px';
      ballEl.style.top = rect.y + 'px';

      if(clearSet[cell.r + ',' + cell.c]){
        var cellEl = boardEl.querySelector('.cell[data-r="' + cell.r + '"][data-c="' + cell.c + '"]');
        if(cellEl){
          var shape = cellEl.querySelector('.shape');
          if(shape){
            shape.classList.add('clearing');
          }
          cellEl.classList.add('empty');
          cellEl.addEventListener('click', onCellClick);
        }
      }

      i++;
      setTimeout(step, stepDelay);
    }

    setTimeout(step, stepDelay);
  }

  function finishShot(result){
    if(result.exited){
      var last = result.path[result.path.length-1];
      var rect = cellRect(last.r, last.c);
      var dx = (result.finalDir.x) * rect.w;
      var dy = (result.finalDir.y) * rect.h;
      ballEl.style.left = (rect.x + dx) + 'px';
      ballEl.style.top = (rect.y + dy) + 'px';
    }
    setTimeout(function(){
      ballEl.style.opacity = 0;
      state.selected = null;
      state.animating = false;
      showResult(countRemaining(state.grid) === 0);
    }, 160);
  }

  function showResult(won){
    var title = document.getElementById('overlayTitle');
    title.textContent = won ? 'Cleared!' : 'Almost!';
    overlay.hidden = false;
  }

  // events
  document.getElementById('overlayNew').addEventListener('click', function(){ overlay.hidden = true; newPuzzle(); });
  document.getElementById('overlayReset').addEventListener('click', function(){ overlay.hidden = true; resetPuzzle(); });
  var helpOverlay = document.getElementById('helpOverlay');
  document.getElementById('helpBtn').addEventListener('click', function(){ helpOverlay.hidden = false; });
  document.getElementById('helpClose').addEventListener('click', function(){ helpOverlay.hidden = true; });
  dirPad.querySelectorAll('button[data-dir]').forEach(function(btn){
    btn.addEventListener('click', function(){ launch(btn.dataset.dir); });
  });
  var sizeSelect = document.getElementById('sizeSelect');
  sizeSelect.addEventListener('change', function(){
    state.size = +sizeSelect.value;
    newPuzzle();
  });

  function updateURL(){
    var params = new URLSearchParams(window.location.search);
    params.set('puzzle', state.seed);
    var url = window.location.pathname + '?' + params.toString();
    window.history.replaceState(null, '', url);
  }

  // init -- a shared link (?puzzle=...) fully reproduces the puzzle: size is
  // decoded from the seed itself, so there's nothing else to read.
  var initParams = new URLSearchParams(window.location.search);
  var urlSeed = parseInt(initParams.get('puzzle'), 10);
  state.size = +sizeSelect.value;
  newPuzzle(isNaN(urlSeed) ? undefined : urlSeed);

  window.addEventListener('resize', function(){
    if(!state.animating) render();
  });
})();
</script>
</body>
</html>
